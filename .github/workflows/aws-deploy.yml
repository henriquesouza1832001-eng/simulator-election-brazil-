name: Build and deploy Mandato

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'public/**'
      - 'data/**'
      - 'deploy/nginx.conf'
      - 'compose.yaml'
      - 'web.Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.js'
      - '.github/workflows/aws-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mandato-production
  cancel-in-progress: false

jobs:
  quality:
    name: Validate the playable build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Build the browser game
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Check the game API
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

  deployment-not-configured:
    name: Report pending AWS connection
    needs: quality
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN == ''
    runs-on: ubuntu-latest
    steps:
      - name: Explain one-time setup
        run: echo '::notice::Build passed. AWS deploy is paused until repository variable AWS_DEPLOY_ROLE_ARN is set from the mandato-github-deploy CloudFormation stack output.'

  deploy:
    name: Deploy through Systems Manager
    needs: quality
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      AWS_INSTANCE_ID: i-0f31ff537ae4f1831
      PUBLIC_GAME_URL: https://d2dpmk0vrt66wn.cloudfront.net
    steps:
      - name: Check out the deployment script
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Exchange GitHub OIDC token for AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: mandato-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deployment to the game host
        shell: bash
        run: |
          set -euo pipefail
          deploy_script_base64="$(base64 -w0 deploy/aws/remote-deploy.sh)"
          command="printf '%s' '$deploy_script_base64' | base64 -d | bash -s -- '$GITHUB_SHA'"
          parameters="$(jq -cn --arg command "$command" '{commands: [$command]}')"
          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$AWS_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Mandato deploy ${GITHUB_SHA}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          echo "SSM command: $command_id"
          aws ssm wait command-executed --region "$AWS_REGION" --command-id "$command_id" --instance-id "$AWS_INSTANCE_ID" || true
          status="$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$AWS_INSTANCE_ID" \
            --query Status \
            --output text)"
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$AWS_INSTANCE_ID" \
            --query StandardOutputContent \
            --output text
          if [[ "$status" != "Success" ]]; then
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$AWS_INSTANCE_ID" \
              --query StandardErrorContent \
              --output text
            echo "AWS deployment finished with status: $status" >&2
            exit 1
          fi
          curl --retry 8 --retry-delay 5 --retry-all-errors --fail --silent --show-error "$PUBLIC_GAME_URL/api/health"
